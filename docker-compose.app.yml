name: tilbot
services:
  ollama: &ollama
    build:
      context: .
      args:
        PORT: ${PORT}
    restart: unless-stopped
    environment:
      MODEL: ${MODEL}
      PORT: ${PORT}
    ports:
      - ${PORT}:${PORT}
    volumes:
      - .:/app
      - ollama:/root/.ollama
    profiles: [""]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  ollama-cpu:
    <<: *ollama
    profiles: ["cpu"]
    deploy: {}

volumes:
  ollama:
