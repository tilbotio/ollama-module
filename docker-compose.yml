name: tilbot
services:
  ollama:
    build:
      context: .
      args:
        PORT: ${PORT}
    restart: unless-stopped
    environment:
      MODEL: ${MODEL}
      PORT: ${PORT}
    networks:
      tbpluginnetwork:
    volumes:
      - ollama:/root/.ollama      

networks:
  tbpluginnetwork:
    driver: bridge
    ipam:
      driver: default

volumes:
  ollama:
