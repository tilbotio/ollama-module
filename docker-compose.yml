name: tilbot
services:
  ollama: &ollama
    build:
      context: .
      args:
        PORT: ${PORT}
    restart: unless-stopped
    environment:
      MODEL: ${MODEL}
      PORT: ${PORT}
    networks:
      tbpluginnetwork:
    volumes:
      - ollama:/root/.ollama
    profiles: [""]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  ollama-cpu:
    <<: *ollama
    profiles: ["cpu"]
    deploy: {}

networks:
  tbpluginnetwork:
    driver: bridge
    ipam:
      driver: default

volumes:
  ollama:
